<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nabung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nabung Biar Gak Pesugihan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b6b72;--line:#e4e4e7;--soft:#f4f4f5;--main:#111;--onmain:#fff;--in:#12805c;--out:#b93c2a;--gt:#e7f5ef;--rt:#fbeae7;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c0c0d;--ink:#f4f4f5;--mute:#9a9aa2;--line:#27272a;--soft:#18181b;--main:#f4f4f5;--onmain:#0c0c0d;--in:#4cc38a;--out:#ff8a75;--gt:#10281e;--rt:#2e1713}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Inter",system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:480px;margin:0 auto;padding:22px 22px 170px}
h1{font-size:24px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
h2{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--mute);font-size:14px;margin:0 0 20px}.sub0{margin:0;font-size:14px;color:var(--mute)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;width:100%;text-align:left}
.row:active,.tile:active,.q:active,.k:active,.ch:active{transform:scale(.97)}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}
.av.sm{width:26px;height:26px;font-size:12px}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{font-weight:700;font-variant-numeric:tabular-nums}.note{color:var(--mute);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.bcard{background:#111;color:#fff;border-radius:24px;padding:22px;margin-bottom:6px}
.brow{display:flex;justify-content:space-between;align-items:center;color:#c4c4cb;font-size:14px}
.brow button{background:none;border:0;color:#c4c4cb;padding:6px;margin:-6px}
.bamt{font-size:36px;font-weight:700;letter-spacing:-1px;margin:6px 0 18px}
.bsub{display:flex;gap:12px;font-size:13px}.bsub>div{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;color:#c4c4cb}
.bsub b{display:block;margin-top:2px;font-size:15px}.gi{color:#6ee7b7}.ro{color:#fca5a5}
.scard{background:var(--soft);border-radius:24px;padding:20px 22px}
.scard .bamt{font-size:34px;margin:4px 0 14px}.srow{display:flex;gap:24px;font-size:13px;color:var(--mute)}.srow b{display:block;font-size:15px}
.qa{display:flex;justify-content:space-around;margin:24px 0 22px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-size:13px;font-weight:600}
.q span{width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}
.tile{border:1px solid var(--line);background:none;border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ti{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ti.in{background:var(--gt);color:var(--in)}.ti.out{background:var(--rt);color:var(--out)}.ti.neu{background:var(--soft);color:var(--ink)}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--in);font-size:14px;font-weight:600;padding:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.ch{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:none;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.ch.on{background:var(--main);color:var(--onmain);border-color:var(--main)}
.tx{display:flex;align-items:center;gap:14px;padding:12px 0}
.tx b{font-size:15px}.tr{text-align:right}
.del{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 0;text-decoration:underline}
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:0 14px;height:46px;color:var(--mute);margin:0 0 6px}
.search input{flex:1;border:0;background:none;padding:0;height:100%;border-radius:0}
.back{background:none;border:0;color:var(--mute);font-size:14px;font-weight:500;padding:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500}
.stats{display:flex;gap:12px;margin:0 0 8px}.stats div{flex:1;background:var(--soft);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mute)}
.sec{font-size:13px;font-weight:500;color:var(--mute);margin:8px 0 2px}
.empty{text-align:center;color:var(--mute);padding:36px 10px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:10}
.tabs>div{max-width:480px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
.tab{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;font-size:11px;font-weight:600}
.tab.on{color:var(--ink)}.slot{width:78px;flex:none}
.navfab{position:absolute;left:50%;top:-26px;margin-left:-30px;width:60px;height:60px;border-radius:50%;border:0;background:var(--main);color:var(--onmain);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.navfab .ic{width:28px;height:28px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--main);color:var(--onmain);border:0;border-radius:999px;padding:14px 26px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:14px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:20px;margin:0 0 8px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:16px 0 8px}
label.c{text-align:center;margin-bottom:0}.chips.c{justify-content:center}
label.search{margin:0 0 6px;font-weight:400}
input{width:100%;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input:focus{border-color:var(--ink);outline:0}
input.big{border:0;text-align:center;font-size:42px;font-weight:700;letter-spacing:-1.5px;height:68px}
.segb{display:flex;gap:8px;background:var(--soft);border-radius:16px;padding:5px}
.segb button{flex:1;height:48px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--mute)}
.segb button.on.in{background:var(--in);color:#fff}.segb button.on.out{background:var(--out);color:#fff}
.btn{width:100%;margin-top:20px;height:56px;border:0;border-radius:16px;background:var(--main);color:var(--onmain);font-size:16px;font-weight:600}
.btn.ghost{background:none;color:var(--mute);margin-top:4px;height:44px}.btn:disabled{opacity:.5}
.err{color:var(--out);font-size:14px;margin-top:10px;min-height:1em}
.login{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100vh - 44px);padding-top:4vh}
.login>*{width:100%}.login .logo{width:52px;height:52px;border-radius:14px;background:var(--main);color:var(--onmain);display:grid;place-items:center;margin-bottom:20px}
.login h2{font-size:26px;font-weight:700;letter-spacing:-.8px;margin:0 0 6px}
.login label{text-align:left}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.dot.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.k{height:66px;border:0;border-radius:20px;background:var(--soft);font-size:26px;font-weight:500;display:grid;place-items:center}
.alt{margin-top:auto;padding-top:24px}.lnk.b{color:var(--ink);font-size:15px;display:block;margin:0 auto}
.foot{font-size:12px;color:var(--mute);margin:8px 0 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal"></div>
<div id="report"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
// ====== ISI DUA BARIS INI (dari Supabase > Project Settings > API) ======
const CFG={url:"https://gjsywyhksrispbdoznrx.supabase.co",key:"sb_publishable_I4ka_RotC90HmgUaK3LLEw_qkdANdSO"};
// =======================================================================

const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const saldo=m=>(m.txs||[]).reduce((s,t)=>s+(t.type==="in"?t.amount:-t.amount),0);
const MSG={auth:"Password admin salah, atau terlalu banyak percobaan. Tunggu beberapa menit.",pin_taken:"PIN ini sudah dipakai anggota lain. Pilih PIN lain.",pin_format:"PIN harus 6 angka.",saldo:"Penarikan melebihi saldo.",pw_short:"Password baru minimal 8 karakter.",same:"PIN baru harus berbeda dari PIN lama.",name:"Isi nama anggota.",input:"Data tidak valid."};
const app=document.getElementById("app"),modal=document.getElementById("modal");
let role=null,secret=null,members=[],me=null,sel=null,tab=null,period={mode:"all"},loginAdmin=false,loading=false,hide=false,q="";

async function rpc(fn,args){
  const h={apikey:CFG.key,"Content-Type":"application/json"};
  if(CFG.key.startsWith("eyJ"))h.Authorization="Bearer "+CFG.key;
  const r=await fetch(CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)});
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
const saveSess=()=>{try{sessionStorage.setItem("sess",JSON.stringify(role?{role,secret}:null))}catch(e){}};
async function load(quiet){
  const res=role==="admin"?await rpc("admin_list",{p_admin:secret}):await rpc("member_view",{p_pin:secret});
  if(!res.ok){if(!quiet)logout();return res}
  if(role==="admin")members=res.members;else me=res;
  return res;
}
function logout(){role=null;secret=null;members=[];me=null;sel=null;tab=null;period={mode:"all"};saveSess();render()}
async function refresh(){try{await load();if(role)render()}catch(e){alert("Gagal memuat data. Periksa koneksi internet.")}}

const ICONS={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.4c2 .7 3.5 2.6 3.5 5.6"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a15 15 0 0 1-3.2 3.6M6.5 7.6C4 9.3 3 12 3 12s4 6 9 6c1.2 0 2.3-.3 3.3-.7"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',adduser:'<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3-6 7-6M18 8v6M15 11h6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',menu:'<path d="M4 12h16M4 6h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',del:'<path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9l4 6M17 9l-4 6"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'};
const sv=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const TABS={admin:[["beranda","Beranda","home"],["anggota","Anggota","users"],null,["laporan","Laporan","doc"],["lainnya","Lainnya","menu"]],member:[["saldo","Saldo","home"],["riwayat","Riwayat","clock"],["akun","Akun","user"]]};
const tot=x=>{const l=x.txs||[];return{i:l.filter(t=>t.type==="in").reduce((a,t)=>a+t.amount,0),o:l.filter(t=>t.type==="out").reduce((a,t)=>a+t.amount,0)}};
const menu=(id,label,sub)=>`<button class="row" id="${id}"><div class="grow"><div class="nm">${label}</div>${sub?`<div class="note">${sub}</div>`:""}</div><span class="note">›</span></button>`;
const empty=`<div class="empty">Belum ada transaksi.</div>`;
const initial=n=>esc((n||"?").trim()[0]||"?").toUpperCase();
const curM=()=>today().slice(0,7);
const prevM=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const chipsBar=()=>{const a=period.mode==="all"?"all":period.mode==="month"&&period.month===curM()?"cur":period.mode==="month"&&period.month===prevM()?"prev":"pick";return `<div class="chips">${[["all","Semua"],["cur","Bulan ini"],["prev","Bulan lalu"],["pick","Pilih tanggal"]].map(c=>`<button class="ch${a===c[0]?" on":""}" data-pc="${c[0]}">${c[1]}</button>`).join("")}</div>`};
function txRow(t,adm,who){
  const kind=t.type==="in"?"Setoran":"Penarikan";
  return `<div class="tx"><span class="ti ${t.type}">${sv(t.type==="in"?"down":"up")}</span><div class="grow"><b>${esc(who||kind)}</b><div class="note">${who?kind+" · ":""}${fdate(t.date)}${t.note?" · "+esc(t.note):""}</div></div><div class="tr"><div class="bal ${t.type}">${t.type==="in"?"+":"−"}${rp(t.amount)}</div>${adm?`<button class="del" data-edit="${t.id}" style="margin-right:12px">Edit</button><button class="del" data-del="${t.id}">Hapus</button>`:""}</div></div>`;
}
const mrow=x=>`<button class="row" data-m="${x.id}"><div class="av">${initial(x.name)}</div><div class="grow"><div class="nm">${esc(x.name)}</div><div class="note">${x.txs.length} transaksi</div></div><div class="bal">${rp(saldo(x))}</div></button>`;
const mlist=(limit,qq)=>{let l=members.filter(x=>x.name.toLowerCase().includes(qq.toLowerCase()));const more=limit&&!qq&&l.length>limit;if(limit&&!qq)l=l.slice(0,limit);return (l.map(mrow).join("")||`<div class="empty">${members.length?"Tidak ada yang cocok.":"Belum ada anggota. Ketuk “Anggota baru” untuk mulai."}</div>`)+(more?`<button class="lnk" id="more">Lihat semua anggota</button>`:"")};
const membersBlock=limit=>`<label class="search">${sv("search")}<input id="q" placeholder="Cari nama anggota" value="${esc(q)}" autocomplete="off" aria-label="Cari nama anggota"></label><div class="list" id="mlist">${mlist(limit,q)}</div>`;
function view(m){
  if(role==="member"){
    if(!me)return `<p class="sub">Memuat…</p>`;
    const t=tot(me),pd=periodData(me),first=(me.name||"").trim().split(" ")[0];
    if(tab==="saldo")return `<div class="hd"><div><p class="sub0">Tabungan Anda</p><h1>Halo, ${esc(first)}</h1></div><div class="av">${initial(me.name)}</div></div>
    <section class="bcard"><div class="brow"><span>Saldo tabungan</span><button id="eye" aria-label="${hide?"Tampilkan":"Sembunyikan"} saldo">${sv(hide?"eyeoff":"eye")}</button></div><p class="bamt">${hide?"Rp ••••••":rp(t.i-t.o)}</p><div class="bsub"><div>Setoran<b class="gi">${hide?"••••":rp(t.i)}</b></div><div>Penarikan<b class="ro">${hide?"••••":rp(t.o)}</b></div></div></section>
    <div class="qa"><button class="q" id="go-r"><span>${sv("clock")}</span>Riwayat</button><button class="q" id="pdf"><span>${sv("doc")}</span>Laporan PDF</button><button class="q" id="pin"><span>${sv("lock")}</span>Ganti PIN</button></div>
    <div class="sech"><h2>Transaksi terakhir</h2><button class="lnk" id="go-r2">Lihat semua</button></div>${chipsBar()}${pd.list.slice(0,4).map(x=>txRow(x,false)).join("")||empty}`;
    if(tab==="riwayat")return `<h1>Riwayat transaksi</h1><p class="sub">${pd.list.length} transaksi</p>${chipsBar()}${summaryHtml(pd)}${pd.list.map(x=>txRow(x,false)).join("")||empty}`;
    return `<h1>Akun</h1><p class="sub">${esc(me.name)}</p><div class="list">${menu("period","Periode laporan",periodLabel())}${menu("pdf","Laporan PDF","Unduh riwayat tabungan Anda")}${menu("pin","Ganti PIN","Buat PIN baru yang hanya Anda yang tahu")}${installRow()}${menu("rf","Segarkan data")}${menu("out","Keluar")}</div>`;
  }
  if(tab==="beranda"){
    let ti=0,to=0;members.forEach(x=>{const t=tot(x);ti+=t.i;to+=t.o});
    const dt=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    return `<div class="hd"><div><p class="sub0">${dt}</p><h1>Halo, Admin</h1></div><div class="av" style="background:var(--main);color:var(--onmain)">A</div></div>
    <section class="scard"><span class="note">Total tabungan · ${members.length} anggota</span><p class="bamt">${rp(ti-to)}</p><div class="srow"><div>Setoran<b class="in">${rp(ti)}</b></div><div>Penarikan<b class="out">${rp(to)}</b></div></div></section>
    <div class="tiles"><button class="tile" id="tile-in"><span class="ti in">${sv("down")}</span>Setoran</button><button class="tile" id="tile-out"><span class="ti out">${sv("up")}</span>Penarikan</button><button class="tile" id="tile-new"><span class="ti neu">${sv("adduser")}</span>Anggota baru</button></div>
    <h2 style="margin-bottom:12px">Anggota</h2>${membersBlock(5)}`;
  }
  if(tab==="anggota"){
    if(m)return `<button class="back" id="back">‹ Semua anggota</button>`+detail(m);
    return `<h1>Anggota</h1><p class="sub">${members.length} orang</p>${membersBlock(0)}`;
  }
  if(tab==="laporan")return `<h1>Laporan</h1><p class="sub">Unduh ringkasan tabungan</p><div class="list">${menu("period","Periode laporan",periodLabel())}${menu("pdf","Laporan PDF","Ringkasan semua anggota")}${menu("export","Unduh CSV","Semua transaksi pada periode terpilih")}</div>`;
  return `<h1>Lainnya</h1><p class="sub">Masuk sebagai admin</p><div class="list">${menu("chpw","Ganti password admin")}${installRow()}${menu("rf","Segarkan data")}${menu("out","Keluar")}</div>`;
}
function bindM(){
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{sel=b.dataset.m;tab="anggota";scrollTo(0,0);render()});
  const mo=document.getElementById("more");if(mo)mo.onclick=()=>{tab="anggota";scrollTo(0,0);render()};
}
function render(){
  if(CFG.url.includes("GANTI")||CFG.key.includes("GANTI")){app.innerHTML=`<div class="empty">Aplikasi belum dihubungkan ke database.<br>Isi <b>CFG.url</b> dan <b>CFG.key</b> di file index.html.</div>`;return}
  if(!role)return loginView();
  const tabs=TABS[role],ids=tabs.filter(Boolean).map(t=>t[0]);if(!ids.includes(tab))tab=ids[0];
  const m=members.find(x=>x.id===sel);if(sel&&!m)sel=null;
  const showM=role==="admin"&&tab==="anggota"?m:null;
  app.innerHTML=view(showM)
   +(showM?`<button class="fab" id="fab">Catat transaksi</button>`:"")
   +`<nav class="tabs"><div>${tabs.map(t=>t?`<button class="tab${t[0]===tab?" on":""}" data-tab="${t[0]}">${sv(t[2])}${t[1]}</button>`:`<span class="slot"></span>`).join("")}${role==="admin"?`<button class="navfab" id="navfab" aria-label="Catat transaksi">${sv("plus")}</button>`:""}</div></nav>`;
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sel=null;scrollTo(0,0);render()});
  bindM();
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delTx(b.dataset.del));
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const t=((showM&&showM.txs)||[]).find(x=>x.id===b.dataset.edit);if(t)txSheet(showM,t)});
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const c=b.dataset.pc;if(c==="pick")return periodSheet();period=c==="all"?{mode:"all"}:{mode:"month",month:c==="cur"?curM():prevM()};render()});
  const qi=document.getElementById("q");if(qi)qi.oninput=()=>{q=qi.value;document.getElementById("mlist").innerHTML=mlist(app.querySelector("#more")||!q?(tab==="beranda"?5:0):0,q);bindM()};
  on("back",()=>{sel=null;render()});
  on("fab",()=>txSheet(showM));
  on("navfab",()=>pickMemberSheet(null));on("tile-in",()=>pickMemberSheet("in"));on("tile-out",()=>pickMemberSheet("out"));on("tile-new",memberSheet);
  on("eye",()=>{hide=!hide;render()});on("go-r",()=>{tab="riwayat";scrollTo(0,0);render()});on("go-r2",()=>{tab="riwayat";scrollTo(0,0);render()});
  on("out",logout);on("rf",refresh);on("export",exportCsv);on("chpw",pwSheet);on("inst",installApp);on("pin",pinSelfSheet);on("period",periodSheet);
  on("pdf",()=>printReport(role==="member"?me:showM));
  on("reset",()=>pinSheet(showM));on("delm",()=>delMember(showM));
}
async function doLogin(v,adm){
  role=adm?"admin":"member";secret=v;
  try{const res=await load(true);if(res.ok){saveSess();render();return null}role=null;secret=null;return res.error==="locked"||res.error==="auth"?MSG.auth:"PIN salah."}
  catch(e){role=null;secret=null;return "Tidak bisa terhubung. Periksa internet Anda."}
}
function loginView(){
  const inst=isStandalone()?"":`<button class="lnk" id="inst">Pasang di layar utama</button>`;
  const head=`<div class="logo">${sv("shield")}</div><h2>NABUNG BIAR GAK PESUGIHAN</h2>`;
  const foot=`<div class="alt"><button class="lnk b" id="sw">${loginAdmin?"Masuk sebagai anggota":"Masuk sebagai admin"}</button>${inst}<p class="foot">PIN disimpan terenkripsi · Koneksi aman (HTTPS)</p></div>`;
  let busy=false,buf="";
  if(loginAdmin){
    app.innerHTML=`<div class="login">${head}<p class="sub">Masuk sebagai admin.</p><label for="p">Password admin</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" id="go">Masuk</button>${foot}</div>`;
    const er=document.getElementById("er"),go=document.getElementById("go"),inp=document.getElementById("p");
    const run=async()=>{const v=inp.value.trim();if(!v){er.textContent="Isi password admin.";return}go.disabled=true;er.textContent="";const msg=await doLogin(v,true);if(msg){er.textContent=msg;go.disabled=false}};
    go.onclick=run;inp.onkeydown=e=>{if(e.key==="Enter")run()};inp.focus();
  }else{
    const dots=n=>Array.from({length:6},(_,i)=>`<i class="dot${i<n?" f":""}"></i>`).join("");
    app.innerHTML=`<div class="login">${head}<p class="sub" style="margin-bottom:0">Masukkan PIN 6 angka Anda</p><div class="dots" id="dots" role="img" aria-label="PIN">${dots(0)}</div><div class="err" id="er"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="k" data-k="${k}">${k}</button>`).join("")}<span></span><button class="k" data-k="0">0</button><button class="k" data-k="del" aria-label="Hapus angka">${sv("del")}</button></div>${foot}</div>`;
    const er=document.getElementById("er"),upd=()=>{document.getElementById("dots").innerHTML=dots(buf.length)};
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
      if(busy)return;er.textContent="";const k=b.dataset.k;
      if(k==="del")buf=buf.slice(0,-1);else if(buf.length<6)buf+=k;
      upd();
      if(buf.length===6){busy=true;const msg=await doLogin(buf,false);busy=false;buf="";if(msg){er.textContent=msg;upd()}}
    });
  }
  document.getElementById("sw").onclick=()=>{loginAdmin=!loginAdmin;loginView()};
  const ib=document.getElementById("inst");if(ib)ib.onclick=installApp;
}
const periodLabel=()=>{
  if(period.mode==="month"){const [y,m]=period.month.split("-");return new Date(+y,+m-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
  if(period.mode==="range"){const f=period.from,t=period.to;return f&&t?fdate(f)+" s/d "+fdate(t):f?"Mulai "+fdate(f):"Sampai "+fdate(t)}
  return "Semua waktu";
};
function periodRange(){
  if(period.mode==="month"){const [y,m]=period.month.split("-");return [period.month+"-01",period.month+"-"+String(new Date(+y,+m,0).getDate()).padStart(2,"0")]}
  if(period.mode==="range")return [period.from||"0000-01-01",period.to||"9999-12-31"];
  return null;
}
function periodData(x){
  const r=periodRange(),all=x.txs||[],eff=t=>t.type==="in"?t.amount:-t.amount;
  const open=r?all.filter(t=>t.date<r[0]).reduce((a,t)=>a+eff(t),0):0;
  const list=r?all.filter(t=>t.date>=r[0]&&t.date<=r[1]):all;
  const inn=list.filter(t=>t.type==="in").reduce((a,t)=>a+t.amount,0),out=list.filter(t=>t.type==="out").reduce((a,t)=>a+t.amount,0);
  return{list,open,inn,out,close:open+inn-out};
}
const filterBar=()=>`<div class="bar"><button class="chip" id="period">Periode: ${esc(periodLabel())} ▾</button></div>`;
const summaryHtml=p=>period.mode==="all"?"":`<div class="stats" style="margin-bottom:8px"><div><span>Setoran</span><b class="in">${rp(p.inn)}</b></div><div><span>Penarikan</span><b class="out">${rp(p.out)}</b></div></div><p class="note" style="margin:0 0 12px">Saldo awal ${rp(p.open)} · Saldo akhir ${rp(p.close)}</p>`;
function periodSheet(){
  const cm=today().slice(0,7),d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);
  const pm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  sheet(`<h2>Pilih periode</h2>
  <div class="seg"><button id="p-all">Semua</button><button id="p-cur">Bulan ini</button><button id="p-prev">Bulan lalu</button></div>
  <label for="pm">Atau pilih bulan tertentu</label><input id="pm" type="month" value="${period.mode==="month"?period.month:cm}">
  <label for="pf">Atau rentang tanggal: dari</label><input id="pf" type="date" value="${period.from||""}">
  <label for="pt">sampai</label><input id="pt" type="date" value="${period.to||""}">
  <div class="err" id="er"></div><button class="btn" id="ok">Terapkan</button><button class="btn ghost" id="cx">Batal</button>`);
  const apply=p=>{period=p;close();render()};
  document.getElementById("p-all").onclick=()=>apply({mode:"all"});
  document.getElementById("p-cur").onclick=()=>apply({mode:"month",month:cm});
  document.getElementById("p-prev").onclick=()=>apply({mode:"month",month:pm});
  document.getElementById("ok").onclick=()=>{
    const f=document.getElementById("pf").value,t=document.getElementById("pt").value,m=document.getElementById("pm").value,er=document.getElementById("er");
    if(f||t){if(f&&t&&f>t){er.textContent="Tanggal awal harus sebelum tanggal akhir.";return}apply({mode:"range",from:f,to:t})}
    else if(/^\d{4}-\d{2}$/.test(m))apply({mode:"month",month:m});
    else er.textContent="Pilih bulan atau isi rentang tanggal.";
  };
}

function sheet(html){modal.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet">${html}</div></div>`;document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")close()};document.getElementById("cx").onclick=close}
async function act(btn,fn,args){
  const er=document.getElementById("er");btn.disabled=true;er.textContent="";
  try{
    const res=await rpc(fn,args);
    if(!res.ok){if(res.error==="auth"){close();logout();return}er.textContent=MSG[res.error]||"Gagal menyimpan.";btn.disabled=false;return}
    await load();close();render();
  }catch(e){er.textContent="Tidak bisa terhubung. Coba lagi.";btn.disabled=false}
}

function printReport(m){
  const J=window.jspdf;
  if(!J||!J.jsPDF){alert("Pustaka PDF belum termuat. Periksa koneksi internet, lalu muat ulang halaman.");return}
  const doc=new J.jsPDF({unit:"pt",format:"a4"});
  const d=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  const filtered=period.mode!=="all";
  const head=(title,sub)=>{doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text(title,40,52);doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(100);doc.text(sub,40,72);doc.setTextColor(0)};
  const hs={fillColor:[31,78,95],textColor:255};
  let title;
  if(m){
    const p=periodData(m);let run=p.open,y=100;
    title="Laporan Tabungan - "+m.name;
    head("Laporan Tabungan","Anggota: "+m.name+"  |  Periode: "+periodLabel()+"  |  Dicetak "+d);
    doc.setFontSize(12);
    const line=(t,bold)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.text(t,40,y);y+=18};
    if(filtered)line("Saldo awal: "+rp(p.open));
    line("Total setoran: "+rp(p.inn));line("Total penarikan: "+rp(p.out));line((filtered?"Saldo akhir: ":"Saldo: ")+rp(p.close),true);
    doc.setFont("helvetica","normal");
    const body=p.list.slice().reverse().map(x=>{run+=x.type==="in"?x.amount:-x.amount;return[fdate(x.date),x.type==="in"?"Setoran":"Penarikan",x.note||"",(x.type==="in"?"":"-")+rp(x.amount),rp(run)]});
    doc.autoTable({startY:y+8,head:[["Tanggal","Jenis","Catatan","Jumlah","Saldo"]],body:body.length?body:[[{content:"Tidak ada transaksi pada periode ini.",colSpan:5}]],styles:{fontSize:10},headStyles:hs,columnStyles:{3:{halign:"right"},4:{halign:"right"}}});
  }else{
    let to=0,ti=0,so=0,sc=0;
    title="Laporan Tabungan Bersama";
    const body=members.map(x=>{const p=periodData(x);so+=p.open;ti+=p.inn;to+=p.out;sc+=p.close;return[x.name].concat(filtered?[rp(p.open)]:[],[rp(p.inn),rp(p.out),rp(p.close)])});
    const cols=filtered?["Anggota","Saldo awal","Setoran","Penarikan","Saldo akhir"]:["Anggota","Setoran","Penarikan","Saldo"];
    const foot=["Total"].concat(filtered?[rp(so)]:[],[rp(ti),rp(to),rp(sc)]);
    const cs={};for(let i=1;i<cols.length;i++)cs[i]={halign:"right"};
    head("Laporan Tabungan Bersama",members.length+" anggota  |  Periode: "+periodLabel()+"  |  Dicetak "+d);
    doc.autoTable({startY:95,head:[cols],body:body.length?body:[[{content:"Belum ada anggota.",colSpan:cols.length}]],foot:[foot],styles:{fontSize:10},headStyles:hs,footStyles:{fillColor:[235,235,235],textColor:0},columnStyles:cs});
  }
  doc.save((title+(filtered?" "+periodLabel():"")).replace(/[^\w-]+/g,"-")+"-"+today()+".pdf");
}

  <p class="note" id="after" style="margin:14px 0 0"></p>
  <div class="err" id="er"></div><button class="btn" id="ok">${t?"Simpan perubahan":"Simpan transaksi"}</button><button class="btn ghost" id="cx">Batal</button>`);
  const $=id=>document.getElementById(id),am=$("am"),dt=$("dt"),ok=$("ok"),amt=()=>parseInt(am.value.replace(/\D/g,""),10)||0;
  const base=t?saldo(m)-eff(t.type,t.amount):saldo(m);
  let pick=!!t&&t.date!==today()&&t.date!==yest();
  const upd=()=>{
    $("after").innerHTML="Saldo setelah transaksi: <b>"+rp(base+eff(type,amt()))+"</b>";
    $("t-in").className=type==="in"?"on in":"";$("t-out").className=type==="out"?"on out":"";
    $("d-t").classList.toggle("on",!pick&&dt.value===today());$("d-y").classList.toggle("on",!pick&&dt.value===yest());$("d-p").classList.toggle("on",pick||(dt.value!==today()&&dt.value!==yest()));
    dt.style.display=$("d-p").classList.contains("on")?"":"none";
  };
  $("t-in").onclick=()=>{type="in";upd()};$("t-out").onclick=()=>{type="out";upd()};
  am.oninput=()=>{const n=amt();am.value=n?fmt(n):"";upd()};
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{am.value=fmt(amt()+Number(b.dataset.add));upd()});
  $("d-t").onclick=()=>{pick=false;dt.value=today();upd()};$("d-y").onclick=()=>{pick=false;dt.value=yest();upd()};$("d-p").onclick=()=>{pick=true;upd();dt.focus()};
  dt.onchange=()=>{pick=dt.value!==today()&&dt.value!==yest();upd()};
  ok.onclick=()=>{
    const er=$("er"),amount=amt(),date=dt.value,note=$("nt").value.trim();
    if(!amount||amount<=0){er.textContent="Isi jumlah lebih dari 0.";return}
    if(!date){er.textContent="Pilih tanggal.";return}
    if(base+eff(type,amount)<0){er.textContent=t?"Perubahan ini membuat saldo menjadi negatif.":"Penarikan melebihi saldo ("+rp(saldo(m))+").";return}
    if(t)act(ok,"admin_edit_tx",{p_admin:secret,p_id:t.id,p_type:type,p_amount:amount,p_date:date,p_note:note});
    else act(ok,"admin_add_tx",{p_admin:secret,p_member:m.id,p_type:type,p_amount:amount,p_date:date,p_note:note});
  };
  upd();am.focus();
}
async function delTx(id){
  if(!confirm("Hapus transaksi ini? Saldo akan dihitung ulang."))return;
  try{const r=await rpc("admin_del_tx",{p_admin:secret,p_id:id});if(r.ok){await load();render()}else alert(MSG[r.error]||"Gagal menghapus.")}catch(e){alert("Tidak bisa terhubung. Coba lagi.")}
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[];members.forEach(m=>periodData(m).list.forEach(t=>rows.push([t.date,q(m.name),t.type==="in"?"Setoran":"Penarikan",t.amount,q(t.note||"")])));
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  const csv="\ufeffTanggal,Anggota,Jenis,Jumlah,Catatan\n"+rows.map(r=>r.join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=("tabungan"+(period.mode!=="all"?" "+periodLabel():"")).replace(/[^\w-]+/g,"-")+"-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(async()=>{
  render();
  if(CFG.url.includes("GANTI"))return;
  let s=null;try{s=JSON.parse(sessionStorage.getItem("sess"))}catch(e){}
  if(s&&s.role&&s.secret){role=s.role;secret=s.secret;try{const r=await load();if(r.ok)render()}catch(e){logout()}}
})();
</script>
