<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<title>Tabungan Bersama</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f1ec;--card:#fffdf9;--ink:#1d2a3a;--mute:#6b7787;--line:#e3dfd6;--main:#1f4e5f;--onmain:#fff;--in:#18794e;--out:#b4472c;--sun:#f2b632;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121a22;--card:#1a2530;--ink:#eef1f4;--mute:#97a3b1;--line:#2a3745;--main:#7cc3d6;--onmain:#0e1a20;--in:#5fd39b;--out:#ff9a7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 4px}
.total{font-size:40px;font-weight:800;letter-spacing:-1px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 20px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--main);color:var(--onmain);display:grid;place-items:center;font-weight:800;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{font-weight:800}.note{color:var(--mute);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}
.back{background:none;border:0;color:var(--main);font:600 15px inherit;padding:4px 0 12px;cursor:pointer}
.hero{background:var(--main);color:var(--onmain);border-radius:18px;padding:20px;margin-bottom:18px}
.hero .total{margin:0}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.del{background:none;border:0;color:var(--mute);font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--sun);color:#2b2100;border:0;border-radius:999px;padding:15px 26px;font:800 16px inherit;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px inherit;cursor:pointer}
.seg button.on.in{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.out{background:var(--out);color:#fff;border-color:var(--out)}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--main);color:var(--onmain);font:800 16px inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--mute);margin-top:6px;font-weight:600}
.btn:disabled{opacity:.6}
.err{color:var(--out);font-size:14px;margin-top:10px;min-height:1em}
.empty{text-align:center;color:var(--mute);padding:36px 10px;border:1px dashed var(--line);border-radius:14px}
.bar{display:flex;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.login{margin-top:8vh}.login h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px}
.warn{font-size:13px;color:var(--mute);margin-top:18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal"></div>
<script>
// ====== ISI DUA BARIS INI (dari Supabase > Project Settings > API) ======
const CFG={url:"https://gjsywyhksrispbdoznrx.supabase.co",key:"sb_publishable_I4ka_RotC90HmgUaK3LLEw_qkdANdSO"};
// =======================================================================

const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const saldo=m=>(m.txs||[]).reduce((s,t)=>s+(t.type==="in"?t.amount:-t.amount),0);
const MSG={auth:"Password admin salah, atau terlalu banyak percobaan. Tunggu beberapa menit.",pin_taken:"PIN ini sudah dipakai anggota lain. Pilih PIN lain.",pin_format:"PIN harus 6 angka.",saldo:"Penarikan melebihi saldo.",pw_short:"Password baru minimal 8 karakter.",name:"Isi nama anggota.",input:"Data tidak valid."};
const app=document.getElementById("app"),modal=document.getElementById("modal");
let role=null,secret=null,members=[],me=null,sel=null,loginAdmin=false,loading=false;

async function rpc(fn,args){
  const h={apikey:CFG.key,"Content-Type":"application/json"};
  if(CFG.key.startsWith("eyJ"))h.Authorization="Bearer "+CFG.key;
  const r=await fetch(CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)});
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
const saveSess=()=>{try{sessionStorage.setItem("sess",JSON.stringify(role?{role,secret}:null))}catch(e){}};
async function load(){
  const res=role==="admin"?await rpc("admin_list",{p_admin:secret}):await rpc("member_view",{p_pin:secret});
  if(!res.ok){logout();return res}
  if(role==="admin")members=res.members;else me=res;
  return res;
}
function logout(){role=null;secret=null;members=[];me=null;sel=null;saveSess();render()}
async function refresh(){try{await load();if(role)render()}catch(e){alert("Gagal memuat data. Periksa koneksi internet.")}}

function render(){
  if(CFG.url.includes("GANTI")||CFG.key.includes("GANTI")){app.innerHTML=`<div class="empty">Aplikasi belum dihubungkan ke database.<br>Isi <b>CFG.url</b> dan <b>CFG.key</b> di file index.html.</div>`;return}
  if(!role)return loginView();
  const m=members.find(x=>x.id===sel);if(sel&&!m)sel=null;
  const label=role==="admin"?"Admin":esc(me?me.name:"");
  const body=role==="member"?(me?"<h1>Tabungan Anda</h1>"+detail(me,false):""):(m?`<button class="back" id="back">‹ Semua anggota</button>`+detail(m,true):home());
  app.innerHTML=`<div class="top"><span class="note">${label}</span><span><button class="chip" id="rf">Segarkan</button> <button class="chip" id="out">Keluar</button></span></div>`+body+(role==="admin"?`<button class="fab" id="fab">${m?"Catat transaksi":"Tambah anggota"}</button>`:"");
  document.getElementById("out").onclick=logout;
  document.getElementById("rf").onclick=refresh;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{sel=b.dataset.m;scrollTo(0,0);render()});
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{sel=null;render()};
  const fab=document.getElementById("fab");if(fab)fab.onclick=()=>m?txSheet(m):memberSheet();
  const ex=document.getElementById("export");if(ex)ex.onclick=exportCsv;
  const cp=document.getElementById("chpw");if(cp)cp.onclick=pwSheet;
  const rs=document.getElementById("reset");if(rs)rs.onclick=()=>pinSheet(m);
  const dm=document.getElementById("delm");if(dm)dm.onclick=()=>delMember(m);
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delTx(b.dataset.del));
}
function loginView(){
  app.innerHTML=`<div class="login"><h2>Tabungan Bersama</h2><p class="sub">${loginAdmin?"Masuk sebagai admin.":"Masukkan PIN Anda untuk melihat saldo."}</p>
  <label for="p">${loginAdmin?"Password admin":"PIN"}</label>
  <input id="p" type="password" ${loginAdmin?'autocomplete="current-password"':'inputmode="numeric" maxlength="6" autocomplete="one-time-code"'}>
  <div class="err" id="er"></div><button class="btn" id="go">Masuk</button>
  <button class="btn ghost" id="sw">${loginAdmin?"Masuk sebagai anggota":"Masuk sebagai admin"}</button>
  <p class="warn">${loginAdmin?"":"Lupa PIN? Minta admin mengatur ulang."}</p></div>`;
  const er=document.getElementById("er"),go=document.getElementById("go"),inp=document.getElementById("p");
  const run=async()=>{
    const v=inp.value.trim();if(!v){er.textContent=loginAdmin?"Isi password admin.":"Isi PIN Anda.";return}
    go.disabled=true;er.textContent="";
    try{
      role=loginAdmin?"admin":"member";secret=v;
      const res=await load();
      if(res.ok){saveSess();render()}
      else{role=null;secret=null;go.disabled=false;er.textContent=res.error==="locked"||res.error==="auth"?MSG.auth:"PIN salah."}
    }catch(e){role=null;secret=null;go.disabled=false;er.textContent="Tidak bisa terhubung. Periksa internet Anda."}
  };
  go.onclick=run;inp.onkeydown=e=>{if(e.key==="Enter")run()};
  document.getElementById("sw").onclick=()=>{loginAdmin=!loginAdmin;loginView()};
  inp.focus();
}
function home(){
  const total=members.reduce((s,m)=>s+saldo(m),0);
  const rows=members.map(m=>`<button class="row" data-m="${m.id}"><div class="av">${esc((m.name||"?")[0]).toUpperCase()}</div><div class="grow"><div class="nm">${esc(m.name)}</div><div class="note">${m.txs.length} transaksi</div></div><div class="bal">${rp(saldo(m))}</div></button>`).join("");
  return `<h1>Total tabungan semua anggota</h1><p class="total">${rp(total)}</p><p class="sub">${members.length} anggota</p>
  <div class="bar"><button class="chip" id="export">Unduh CSV</button><button class="chip" id="chpw">Ganti password</button></div>
  <div class="list">${rows||`<div class="empty">Belum ada anggota. Ketuk “Tambah anggota” untuk mulai.</div>`}</div>`;
}
function detail(m,adm){
  const list=m.txs||[];
  const inn=list.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),out=list.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0);
  return `<div class="hero"><div style="opacity:.8;font-size:14px">${esc(m.name)}</div><p class="total">${rp(inn-out)}</p><div style="opacity:.8;font-size:13px">Setoran ${rp(inn)} · Penarikan ${rp(out)}</div></div>
  ${adm?`<div class="bar"><button class="chip" id="reset">Atur ulang PIN</button><button class="chip" id="delm">Hapus anggota</button></div>`:""}
  ${list.length?list.map(t=>`<div class="tx"><div><div class="${t.type}" style="font-weight:600">${t.type==="in"?"Setoran":"Penarikan"}</div><div class="note">${fdate(t.date)}${t.note?" · "+esc(t.note):""}</div></div><div style="text-align:right"><div class="bal ${t.type}">${t.type==="in"?"+":"−"}${rp(t.amount)}</div>${adm?`<button class="del" data-del="${t.id}">Hapus</button>`:""}</div></div>`).join(""):`<div class="empty">Belum ada transaksi.</div>`}`;
}
function close(){modal.innerHTML=""}
function sheet(html){modal.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet">${html}</div></div>`;document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")close()};document.getElementById("cx").onclick=close}
async function act(btn,fn,args){
  const er=document.getElementById("er");btn.disabled=true;er.textContent="";
  try{
    const res=await rpc(fn,args);
    if(!res.ok){if(res.error==="auth"){close();logout();return}er.textContent=MSG[res.error]||"Gagal menyimpan.";btn.disabled=false;return}
    await load();close();render();
  }catch(e){er.textContent="Tidak bisa terhubung. Coba lagi.";btn.disabled=false}
}
function memberSheet(){
  sheet(`<h2>Tambah anggota</h2><label for="nm">Nama</label><input id="nm" autocomplete="off">
  <label for="pn">PIN (6 angka, berbeda untuk tiap anggota)</label><input id="pn" inputmode="numeric" maxlength="6" autocomplete="off">
  <div class="err" id="er"></div><button class="btn" id="ok">Simpan anggota</button><button class="btn ghost" id="cx">Batal</button>`);
  const ok=document.getElementById("ok");
  ok.onclick=()=>{
    const er=document.getElementById("er"),name=document.getElementById("nm").value.trim(),p=document.getElementById("pn").value.trim();
    if(!name){er.textContent=MSG.name;return}
    if(!/^\d{6}$/.test(p)){er.textContent=MSG.pin_format;return}
    act(ok,"admin_add_member",{p_admin:secret,p_name:name,p_pin:p});
  };
  document.getElementById("nm").focus();
}
function pwSheet(){
  sheet(`<h2>Ganti password admin</h2><label for="o">Password saat ini</label><input id="o" type="password" autocomplete="current-password">
  <label for="n">Password baru (minimal 8 karakter)</label><input id="n" type="password" autocomplete="new-password">
  <label for="n2">Ulangi password baru</label><input id="n2" type="password" autocomplete="new-password">
  <div class="err" id="er"></div><button class="btn" id="ok">Simpan password</button><button class="btn ghost" id="cx">Batal</button>`);
  const ok=document.getElementById("ok"),er=document.getElementById("er");
  ok.onclick=async()=>{
    const o=document.getElementById("o").value,n=document.getElementById("n").value,n2=document.getElementById("n2").value;
    if(!o){er.textContent="Isi password saat ini.";return}
    if(n.length<8){er.textContent=MSG.pw_short;return}
    if(n!==n2){er.textContent="Password baru dan pengulangannya tidak sama.";return}
    ok.disabled=true;er.textContent="";
    try{
      const r=await rpc("admin_change_password",{p_admin:o,p_new:n});
      if(r.ok){secret=n;saveSess();close();alert("Password admin sudah diganti.")}
      else{er.textContent=r.error==="auth"?"Password saat ini salah, atau terlalu banyak percobaan.":(MSG[r.error]||"Gagal menyimpan.");ok.disabled=false}
    }catch(e){er.textContent="Tidak bisa terhubung. Coba lagi.";ok.disabled=false}
  };
  document.getElementById("o").focus();
}
function pinSheet(m){
  sheet(`<h2>Atur ulang PIN · ${esc(m.name)}</h2><label for="pn">PIN baru (6 angka)</label><input id="pn" inputmode="numeric" maxlength="6" autocomplete="off"><div class="err" id="er"></div><button class="btn" id="ok">Simpan PIN</button><button class="btn ghost" id="cx">Batal</button>`);
  const ok=document.getElementById("ok");
  ok.onclick=()=>{
    const p=document.getElementById("pn").value.trim();
    if(!/^\d{6}$/.test(p)){document.getElementById("er").textContent=MSG.pin_format;return}
    act(ok,"admin_set_pin",{p_admin:secret,p_id:m.id,p_pin:p});
  };
  document.getElementById("pn").focus();
}
async function delMember(m){
  if(!confirm("Hapus "+m.name+" beserta semua riwayatnya? Tindakan ini tidak bisa dibatalkan."))return;
  try{const r=await rpc("admin_del_member",{p_admin:secret,p_id:m.id});if(r.ok){sel=null;await load();render()}else alert(MSG[r.error]||"Gagal menghapus.")}catch(e){alert("Tidak bisa terhubung. Coba lagi.")}
}
function txSheet(m){
  let type="in";
  sheet(`<h2>Catat transaksi · ${esc(m.name)}</h2><div class="seg"><button class="in on" id="t-in">Setoran</button><button class="out" id="t-out">Penarikan</button></div>
  <label for="am">Jumlah (Rp)</label><input id="am" inputmode="numeric" placeholder="50000">
  <label for="dt">Tanggal</label><input id="dt" type="date" value="${today()}">
  <label for="nt">Catatan (opsional)</label><input id="nt" placeholder="Mis. setoran bulan November">
  <div class="err" id="er"></div><button class="btn" id="ok">Simpan transaksi</button><button class="btn ghost" id="cx">Batal</button>`);
  const bi=document.getElementById("t-in"),bo=document.getElementById("t-out"),ok=document.getElementById("ok");
  const set=t=>{type=t;bi.classList.toggle("on",t==="in");bo.classList.toggle("on",t==="out")};
  bi.onclick=()=>set("in");bo.onclick=()=>set("out");
  ok.onclick=()=>{
    const er=document.getElementById("er");
    const amount=parseInt(document.getElementById("am").value.replace(/\D/g,""),10),date=document.getElementById("dt").value;
    if(!amount||amount<=0){er.textContent="Isi jumlah lebih dari 0.";return}
    if(!date){er.textContent="Pilih tanggal.";return}
    if(type==="out"&&amount>saldo(m)){er.textContent="Penarikan melebihi saldo ("+rp(saldo(m))+").";return}
    act(ok,"admin_add_tx",{p_admin:secret,p_member:m.id,p_type:type,p_amount:amount,p_date:date,p_note:document.getElementById("nt").value.trim()});
  };
  document.getElementById("am").focus();
}
async function delTx(id){
  if(!confirm("Hapus transaksi ini? Saldo akan dihitung ulang."))return;
  try{const r=await rpc("admin_del_tx",{p_admin:secret,p_id:id});if(r.ok){await load();render()}else alert(MSG[r.error]||"Gagal menghapus.")}catch(e){alert("Tidak bisa terhubung. Coba lagi.")}
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[];members.forEach(m=>m.txs.forEach(t=>rows.push([t.date,q(m.name),t.type==="in"?"Setoran":"Penarikan",t.amount,q(t.note||"")])));
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  const csv="\ufeffTanggal,Anggota,Jenis,Jumlah,Catatan\n"+rows.map(r=>r.join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="tabungan-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();
}
(async()=>{
  render();
  if(CFG.url.includes("GANTI"))return;
  let s=null;try{s=JSON.parse(sessionStorage.getItem("sess"))}catch(e){}
  if(s&&s.role&&s.secret){role=s.role;secret=s.secret;try{const r=await load();if(r.ok)render()}catch(e){logout()}}
})();
</script>
</body>
</html>
